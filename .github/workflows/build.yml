name: Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: write     # needed to create GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib Pillow

      - name: Inject version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          (Get-Content app/version.py) -replace '"dev"', "`"$version`"" | Set-Content app/version.py

      - name: Build with PyInstaller
        run: pyinstaller logalyzer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Logalyzer-windows
          path: dist/Logalyzer.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Logalyzer.exe
          generate_release_notes: true
